name: Lintsure
description: Readiness checks for the code your AI writes (EU AI Act, GDPR, OWASP, CWE, Cyber Resilience Act). Never uploads your code. Not an audit or legal advice.
branding: { icon: check-circle, color: green }
inputs:
  path: { description: Folder to check, default: "." }
  frameworks: { description: "Comma list: eu-ai-act, gdpr, owasp-top10, owasp-llm, cwe-top25, cra. Empty uses lintsure.config.yaml, or all available.", default: "" }
  preset: { description: "security (OWASP Top 10, CWE Top 25), security-privacy (adds GDPR) or all. Used when frameworks is empty and there is no lintsure.config.yaml.", default: "" }
  changed-only: { description: "On pull requests, list only findings on lines the pull request changed. auto = on for pull_request events.", default: "auto" }
  show-all: { description: "Also list medium-confidence findings, which are held back by default", default: "false" }
  fail-on: { description: "gap, partial, or none", default: "gap" }
  new-only: { description: "When .lintsure/baseline.json exists, fail only on findings that are new since the baseline", default: "true" }
  annotations: { description: "Show findings on the changed lines in the pull request (printed by the runner, no extra permissions)", default: "true" }
  sarif: { description: "Also write lintsure.sarif for GitHub code scanning (upload it with github/codeql-action/upload-sarif)", default: "false" }
  comment: { description: "Post or update one summary comment on the pull request. Needs pull-requests write permission. Sends rule names, file paths, line numbers and suggested fixes to GitHub, never code.", default: "false" }
  ref: { description: "Git ref of github.com/lintsure/lintsure to run (branch, tag or commit)", default: "main" }
outputs:
  report: { description: Path to lintsure-report.json, value: "${{ steps.run.outputs.report }}" }
  sarif: { description: Path to lintsure.sarif when sarif is true, value: "${{ steps.run.outputs.sarif }}" }
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with: { node-version: 22 }
    - shell: bash
      env: { LS_REF: "${{ inputs.ref }}" }
      run: |
        git clone --quiet --depth 1 --branch "$LS_REF" https://github.com/lintsure/lintsure.git "$RUNNER_TEMP/lintsure" \
          || { git clone --quiet https://github.com/lintsure/lintsure.git "$RUNNER_TEMP/lintsure" && git -C "$RUNNER_TEMP/lintsure" checkout --quiet "$LS_REF"; }
        npm ci --prefix "$RUNNER_TEMP/lintsure" --silent
        npm run build --prefix "$RUNNER_TEMP/lintsure" --silent
    - id: run
      shell: bash
      env:
        LS_PATH: ${{ inputs.path }}
        LS_FW: ${{ inputs.frameworks }}
        LS_FAIL: ${{ inputs.fail-on }}
        LS_NEW: ${{ inputs.new-only }}
        LS_ANN: ${{ inputs.annotations }}
        LS_SARIF: ${{ inputs.sarif }}
        LS_PRESET: ${{ inputs.preset }}
        LS_CHANGED: ${{ inputs.changed-only }}
        LS_ALL: ${{ inputs.show-all }}
        LS_EVENT: ${{ github.event_name }}
        LS_BASE: ${{ github.base_ref }}
      run: |
        args=(scan "$LS_PATH" --json)
        if [ -z "$LS_FW" ] && [ -n "$LS_PRESET" ] && [ ! -f "$LS_PATH/lintsure.config.yaml" ]; then
          case "$LS_PRESET" in
            security) LS_FW="owasp-top10,cwe-top25" ;;
            security-privacy) LS_FW="owasp-top10,cwe-top25,gdpr" ;;
            all) LS_FW="" ;;
            *) echo "preset must be security, security-privacy or all, not $LS_PRESET"; exit 2 ;;
          esac
        fi
        [ -n "$LS_FW" ] && args+=(--framework "$LS_FW")
        [ "$LS_ALL" = "true" ] && args+=(--all)
        if [ "$LS_CHANGED" = "true" ] || { [ "$LS_CHANGED" = "auto" ] && [ "$LS_EVENT" = "pull_request" ] && [ -n "$LS_BASE" ]; }; then
          git fetch --quiet --no-tags --depth=1 origin "$LS_BASE" && args+=(--diff FETCH_HEAD) || echo "Could not fetch $LS_BASE; checking every line instead."
        fi
        [ "$LS_FAIL" != "none" ] && args+=(--fail-on "$LS_FAIL")
        [ "$LS_NEW" = "true" ] && args+=(--new-only)
        [ "$LS_ANN" = "true" ] && args+=(--github)
        [ "$LS_SARIF" = "true" ] && args+=(--sarif)
        set +e; node "$RUNNER_TEMP/lintsure/packages/cli/dist/src/index.js" "${args[@]}"; code=$?; set -e
        cat lintsure-report.md >> "$GITHUB_STEP_SUMMARY"
        echo "report=$PWD/lintsure-report.json" >> "$GITHUB_OUTPUT"
        [ "$LS_SARIF" = "true" ] && echo "sarif=$PWD/lintsure.sarif" >> "$GITHUB_OUTPUT"
        echo "code=$code" >> "$GITHUB_OUTPUT"
    - if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        # Only rule names, file paths, line numbers and fixes go into the comment. No code.
        node -e '
          const r = require(process.cwd() + "/lintsure-report.json");
          const open = r.findings.filter((f) => !f.accepted || f.accepted.expired);
          const shown = r.baseline ? open.filter((f) => f.change === "new") : open;
          const head = r.baseline
            ? `**${r.baseline.newCount} new**, ${r.baseline.fixed.length} fixed, ${r.baseline.unchangedCount} unchanged since the baseline.`
            : `${open.length} open finding${open.length === 1 ? "" : "s"}.`;
          const rows = shown.slice(0, 20).map((f) => `| ${f.status} | \`${f.file}:${f.line}\` | ${f.title} | ${f.proposal.what} |`);
          const body = ["### Lintsure", "", head, "",
            ...(rows.length ? ["| Status | Where | Finding | Proposed change (needs your approval) |", "|---|---|---|---|", ...rows, ""] : ["Nothing new to review.", ""]),
            shown.length > 20 ? `And ${shown.length - 20} more in the full report.` : "",
            `[Full report](${process.env.RUN_URL})`, "",
            "<sub>Lintsure is a readiness tool, not an audit, a certification or legal advice. A person decides on every change.</sub>"].join("\n");
          require("fs").writeFileSync("lintsure-comment.md", body);'
        gh pr comment "$PR" --edit-last --create-if-none --body-file lintsure-comment.md
    - shell: bash
      run: exit ${{ steps.run.outputs.code }}
